name: Todoman process
on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  issues: write
  contents: read

concurrency:
  group: todoman-${{ github.event.issue.number }}
  cancel-in-progress: false

env:
  FEATURE_DUMP_TO_ISSUES: ${{ vars.FEATURE_DUMP_TO_ISSUES }}
  TODOMAN_OWNER: ${{ vars.TODOMAN_OWNER }}
  TODOMAN_TZ: ${{ vars.TODOMAN_TZ }}
  CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
  GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
  GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
  GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
  GH_READ_TOKENS: ${{ secrets.GH_READ_TOKENS }}
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >-
      (github.event_name == 'issues'
      && github.event.issue.user.login == (vars.TODOMAN_OWNER || 'masnun-siam')
      && !contains(github.event.issue.labels.*.name, 'task')
      && !contains(github.event.issue.labels.*.name, 'meeting')
      && !contains(github.event.issue.labels.*.name, 'tracking')
      && !contains(github.event.issue.labels.*.name, 'summary')
      && !contains(github.event.issue.labels.*.name, 'todoman:processing')
      && !contains(github.event.issue.labels.*.name, 'processed')
      && !contains(github.event.issue.labels.*.name, 'needs-info')
      && !contains(github.event.issue.labels.*.name, 'failed'))
      || (github.event_name == 'issue_comment'
      && github.event.comment.user.login == (vars.TODOMAN_OWNER || 'masnun-siam')
      && github.event.issue.state == 'open'
      && (contains(github.event.issue.labels.*.name, 'needs-info')
      || contains(github.event.issue.labels.*.name, 'failed')
      || contains(github.event.issue.labels.*.name, 'todoman:processing')))
    steps:
      - uses: masnun-siam/todoman@v1
        with:
          mode: process
      - if: failure() || cancelled()
        uses: masnun-siam/todoman@v1
        with:
          mode: process
          on-failure: 'true'
